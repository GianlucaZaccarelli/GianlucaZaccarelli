name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Debug contributions (temporary)
        env:
          GH_TOKEN: ${{ secrets.STREAK_STATS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "secret: set"; else echo "secret: EMPTY"; fi
          gh api user --jq '"token user: " + .login'
          gh api -i user 2>/dev/null | grep -i '^x-oauth-scopes' || echo "scopes: n/a (fine-grained?)"
          for y in 2022 2023 2024 2025 2026; do
            gh api graphql -F login="${{ github.repository_owner }}" -F from="${y}-01-01T00:00:00Z" -F to="${y}-12-31T23:59:59Z" \
              -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions} restrictedContributionsCount totalCommitContributions}}}' \
              --jq ".data.user.contributionsCollection | \"$y: calendar=\(.contributionCalendar.totalContributions) restricted=\(.restrictedContributionsCount) commits=\(.totalCommitContributions)\"" || true
          done

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || github.token }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update streak stats" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
